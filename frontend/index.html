<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AICore</title>
<style>
:root{--bg:#faf9f5;--side:#f0eee6;--card:#fff;--tx:#29261b;--mu:#73726c;--bd:#e3dfd3;--ac:#c96442;--ok:#2f7d4f;--er:#b3392f}
@media(prefers-color-scheme:dark){:root{--bg:#262624;--side:#1f1e1d;--card:#30302e;--tx:#ecebe4;--mu:#a09f98;--bd:#41403d;--ac:#d97757;--ok:#6cc38b;--er:#ef7b6f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;display:flex}
h1,h2,.logo{font-family:Georgia,"Noto Serif SC",serif;font-weight:500}
nav{width:210px;background:var(--side);border-right:1px solid var(--bd);padding:16px 10px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.logo{font-size:22px;padding:4px 10px 14px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--mu)}
nav button:hover,nav button.on{background:var(--bd);color:var(--tx)}
nav .sp{flex:1}
main{flex:1;overflow-y:auto;padding:28px 32px 60px}
.wrap{max-width:780px;margin:0 auto}
h1{font-size:34px;margin:6vh 0 20px;text-align:center}
h2{font-size:24px;margin:0 0 16px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
textarea,input,select{width:100%;font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.box textarea{border:0;resize:none;min-height:88px;outline:0;padding:4px}
textarea:focus,input:focus{outline:2px solid var(--ac);outline-offset:-1px}
.row{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px}
.btn{cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 14px;font:inherit}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.d{color:var(--er)}
.item{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;margin-top:8px;background:var(--card);cursor:pointer}
.item span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:13px;color:var(--mu);flex-shrink:0}.st.done{color:var(--ok)}.st.failed{color:var(--er)}.st.running{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
label{font-size:13px;color:var(--mu);display:block}
.msg{margin-top:14px;display:flex;gap:10px}
.av{width:30px;height:30px;border-radius:50%;background:var(--side);border:1px solid var(--bd);display:grid;place-items:center;font-size:13px;flex-shrink:0}
.msg .b{flex:1;white-space:pre-wrap;word-break:break-word}
.msg .n{font-size:13px;color:var(--mu)}
.msg.final .b{background:var(--card);border:1px solid var(--ac);border-radius:12px;padding:12px 14px}
.msg.error .b{color:var(--er)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:13px;border:1px solid var(--bd);border-radius:99px;padding:2px 12px;color:var(--mu)}
.muted{color:var(--mu)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bd);margin-right:6px}.dot.on{background:var(--ok)}
@media(max-width:820px){nav{width:62px}nav button{font-size:0}nav button::first-letter{font-size:16px}.logo{font-size:0}.logo::first-letter{font-size:22px}main{padding:20px 16px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav id="nav"></nav>
<main><div class="wrap" id="v"></div></main>
<script src="local.js"></script>
<script>
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={url:localStorage.getItem('url')||'',tok:localStorage.getItem('tok')||''};
const ST={pending:'等待中',planning:'主控规划中',awaiting:'待你确认',running:'专家执行中',done:'已完成',failed:'失败',cancelled:'已取消'};
const KIND={plan:'任务拆分',work:'专家发言',discuss:'评议',final:'最终答案',error:'出错'};
let timer;

const api=(p,o)=>localApi(p,o);
const NAV=[['home','主控台'],['agents','AI 专家团队'],['tasks','任务管理'],['memory','共享记忆'],['settings','设置']];
function nav(cur){$('#nav').innerHTML='<div class="logo">AICore</div>'+NAV.map(([k,t])=>`<button class="${k==cur?'on':''}" onclick="location.hash='#/${k}'">${t}</button>`).join('');}
function err(e){$('#v').innerHTML=`<div class="card" style="color:var(--er)">${h(e.message)}</div><div class="row" style="justify-content:flex-start"><button class="btn" onclick="location.hash='#/settings'">打开设置</button></div>`}

async function route(){
  clearInterval(timer);
  const [,page,arg]=location.hash.split('/');
  const p=page||'home';nav(p=='task'?'tasks':p);
  
  try{await ({home,agents,tasks,memory,settings,task})[p](arg)}catch(e){err(e)}
}
addEventListener('hashchange',route);

function settings(){$('#v').innerHTML='<h2>设置</h2><div class="card">所有数据（任务、记忆、API Key）只保存在这台设备的本应用里，不会上传到任何服务器。卸载应用或清除应用数据会删除全部内容。</div><p class="muted">API Key 请在“AI 专家团队”页填写。</p>';}

async function home(){
  const ts=await api('/tasks');
  $('#v').innerHTML=`<h1>想让专家团队做什么？</h1><div class="box"><textarea id="q" placeholder="描述你的任务，主控 AI 会拆分并分配给专家"></textarea>
  <div class="row"><button class="btn p" onclick="submit()">提交任务</button></div></div>
  <h2 style="margin-top:36px;font-size:18px">最近任务</h2>${list(ts.slice(0,6))||'<p class="muted">还没有任务。写下第一个任务吧。</p>'}`;
}
async function submit(){const t=$('#q').value.trim();if(!t)return;const r=await api('/tasks',{method:'POST',body:{title:t}});location.hash='#/task/'+r.id;}
function list(ts){return ts.map(t=>`<div class="item" onclick="location.hash='#/task/${t.id}'"><span>${h(t.title)}</span><span class="st ${t.status}">${ST[t.status]}</span></div>`).join('')}
async function tasks(){const ts=await api('/tasks');$('#v').innerHTML='<h2>任务管理</h2>'+(list(ts)||'<p class="muted">暂无任务。</p>');}

async function task(id){
  const draw=async()=>{
    const t=await api('/tasks/'+id);
    $('#v').innerHTML=`<h2>${h(t.title)}</h2><div class="st ${t.status}">${ST[t.status]}</div>
    <div class="chips">${t.subtasks.map(s=>`<span class="chip" title="${h(s.instruction)}">${h(s.agent)} · ${ST[s.status]||s.status}</span>`).join('')}</div>
    ${t.messages.map(m=>`<div class="msg ${m.kind}"><div class="av">${h(m.agent[0])}</div><div><div class="n">${h(m.agent)} · ${KIND[m.kind]||''}</div><div class="b">${h(m.content)}</div></div></div>`).join('')||'<p class="muted">主控 AI 正在理解并拆分任务…</p>'}
    ${t.status=='awaiting'?`<div class="card"><label>完善后的需求（可直接修改）</label><textarea id="rf" rows="4">${h(t.refined)}</textarea>
    <label style="margin:12px 0 4px">分配方案（取消勾选可节省费用）</label>
    ${t.plan.map((p,i)=>`<label style="color:var(--tx);margin-top:6px"><input type="checkbox" class="pk" value="${i}" checked style="width:auto"> <b>${h(p.agent)}</b>：${h(p.instruction)}</label>`).join('')}
    <div class="row"><button class="btn d" onclick="cancelTask(${id})">取消</button><button class="btn p" onclick="confirmTask(${id})">确认并执行</button></div></div>`:''}
    ${t.status=='failed'?`<div class="row"><button class="btn p" onclick="retry(${id})">重新执行</button></div>`:''}`;
    return ['awaiting','done','failed','cancelled'].includes(t.status);
  };
  if(!(await draw()))timer=setInterval(async()=>{try{if(await draw())clearInterval(timer)}catch(e){}},2000);
}
async function confirmTask(id){const picks=[...document.querySelectorAll('.pk:checked')].map(e=>+e.value);if(!picks.length)return alert('至少选择一位专家');
  await api(`/tasks/${id}/confirm`,{method:'POST',body:{refined:$('#rf').value,picks}});route();}
async function cancelTask(id){await api(`/tasks/${id}/cancel`,{method:'POST'});location.hash='#/tasks';}
async function retry(id){await api(`/tasks/${id}/retry`,{method:'POST'});route();}

async function agents(){
  const as=await api('/agents');
  $('#v').innerHTML=`<h2>AI 专家团队</h2>`+as.map(a=>`<div class="card" data-id="${a.id}"><div><span class="dot ${a.enabled&&a.has_key?'on':''}"></span><b>${h(a.name)}</b> <span class="muted">${a.role=='manager'?'主控':'专家'} · ${h(a.model)}</span></div>
  <div class="grid"><div><label>名称</label><input data-f="name" value="${h(a.name)}"></div><div><label>角色</label><select data-f="role"><option value="expert" ${a.role=='expert'?'selected':''}>专家</option><option value="manager" ${a.role=='manager'?'selected':''}>主控</option></select></div>
  <div><label>接口类型</label><select data-f="kind"><option value="openai" ${a.kind=='openai'?'selected':''}>OpenAI 兼容</option><option value="anthropic" ${a.kind=='anthropic'?'selected':''}>Anthropic</option></select></div><div><label>模型名称</label><input data-f="model" value="${h(a.model)}"></div></div>
  <label style="margin-top:8px">API 地址</label><input data-f="base_url" value="${h(a.base_url)}">
  <label style="margin-top:8px">API Key ${a.has_key?'（已保存，留空则不修改）':''}</label><input data-f="api_key" type="password" autocomplete="off" placeholder="${a.has_key?'••••••••':'sk-...'}">
  <label style="margin-top:8px">系统提示词</label><textarea data-f="prompt" rows="2">${h(a.prompt)}</textarea>
  <div class="row"><label style="margin-right:auto"><input type="checkbox" data-f="enabled" style="width:auto" ${a.enabled?'checked':''}> 启用</label><span class="st" data-r></span>
  <button class="btn d" onclick="delAgent(${a.id})">删除</button><button class="btn" onclick="testAgent(${a.id},this)">测试连接</button><button class="btn p" onclick="saveAgent(${a.id},this)">保存</button></div></div>`).join('')
  +`<div class="row" style="justify-content:flex-start;margin-top:16px"><button class="btn" onclick="addAgent()">添加专家</button></div>`;
}
function body(c){const b={};c.querySelectorAll('[data-f]').forEach(e=>b[e.dataset.f]=e.type=='checkbox'?e.checked:e.value);return b;}
async function saveAgent(id,btn){const c=btn.closest('.card');await api('/agents/'+id,{method:'PATCH',body:body(c)});agents();}
async function testAgent(id,btn){const c=btn.closest('.card'),r=c.querySelector('[data-r]');r.textContent='测试中…';r.className='st running';
  const b=body(c);await api('/agents/'+id,{method:'PATCH',body:b});const x=await api(`/agents/${id}/test`,{method:'POST'});
  r.textContent=x.ok?'连接成功':x.error;r.className='st '+(x.ok?'done':'failed');}
async function addAgent(){await api('/agents',{method:'POST'});agents();}
async function delAgent(id){if(confirm('确定删除这个 AI？')){await api('/agents/'+id,{method:'DELETE'});agents();}}

async function memory(){
  $('#v').innerHTML=`<h2>共享记忆</h2><input id="s" placeholder="搜索记忆" oninput="loadMem()"><div class="box" style="margin-top:12px"><textarea id="m" placeholder="添加一条重要信息，所有专家都能参考" style="min-height:56px"></textarea>
  <div class="row"><button class="btn p" onclick="addMem()">保存记忆</button></div></div><div id="ml"></div>`;loadMem();
}
async function loadMem(){const ms=await api('/memories?q='+encodeURIComponent($('#s').value));
  $('#ml').innerHTML=ms.map(m=>`<div class="card"><div style="white-space:pre-wrap">${h(m.content)}</div><div class="row" style="justify-content:space-between"><span class="st">${m.source=='task'?'任务结论':'用户添加'} · ${new Date(m.ts*1000).toLocaleString()}</span><button class="btn d" onclick="delMem(${m.id})">删除</button></div></div>`).join('')||'<p class="muted">没有找到记忆。</p>';}
async function addMem(){const c=$('#m').value.trim();if(!c)return;await api('/memories',{method:'POST',body:{content:c}});$('#m').value='';loadMem();}
async function delMem(id){await api('/memories/'+id,{method:'DELETE'});loadMem();}
route();
</script>
</body>
</html>
